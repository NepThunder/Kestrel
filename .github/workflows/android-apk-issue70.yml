# Issue #70 test build: patched chat-keyboard APK for arm64-v8a.
# Runs only on the fix/issue-70-chat-keyboard branch of this fork.
# Not an upstream workflow: it builds a local (non-public) debug APK with
# the generated engine tables from tools/android_prepare.py, then uploads
# the APK as a workflow artifact for on-device testing. No signing secrets
# are needed: android_build.py creates a throwaway debug keystore.
name: Android APK (issue #70)
on:
  push:
    branches: [fix/issue-70-chat-keyboard]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-issue70-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust 1.95 and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Download Gradle 8.14
        run: |
          curl -L -o gradle-8.14-all.zip https://services.gradle.org/distributions/gradle-8.14-all.zip
          unzip -q gradle-8.14-all.zip
          ./gradle-8.14/bin/gradle --version
      - name: Prepare engine resources
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build patched APK (arm64-v8a)
        run: python3 tools/android_build.py --abi arm64-v8a --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$GITHUB_WORKSPACE/gradle-8.14/bin/gradle"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-issue70-arm64
          path: .local/android/apk/arm64-v8a/*.apk
          if-no-files-found: error
