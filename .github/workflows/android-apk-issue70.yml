# Debug-branch test build: APK for arm64-v8a.
# Runs only on the debug-branch branch of this fork.
# Not an upstream workflow: it builds a local (non-public) debug APK with
# the generated engine tables from tools/android_prepare.py, then uploads
# the APK as a release asset for on-device testing, so it downloads as a
# plain .apk file instead of a zipped workflow artifact. No signing secrets
# are needed: android_build.py creates a throwaway debug keystore.
name: Android APK (debug)
on:
  push:
    branches: [debug-branch]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust 1.95 and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Download Gradle 8.14
        run: |
          curl -L -o gradle-8.14-all.zip https://services.gradle.org/distributions/gradle-8.14-all.zip
          unzip -q gradle-8.14-all.zip
          ./gradle-8.14/bin/gradle --version
      - name: Prepare engine resources
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      # Gradle 8.14 cannot run on JDK 25 (Unsupported class file major
      # version 69). Prepare keeps JDK 25, the Gradle build uses JDK 17.
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK (arm64-v8a)
        run: python3 tools/android_build.py --abi arm64-v8a --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$GITHUB_WORKSPACE/gradle-8.14/bin/gradle"
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(ls .local/android/apk/arm64-v8a/*.apk)
          tag="debug-build-${{ github.run_number }}-attempt-${{ github.run_attempt }}"
          gh release create "$tag" --prerelease \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Built from debug-branch commit ${{ github.sha }}. Debug build, not a stable release." \
            "$apk"
